[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.9.0"
description = "Agent-agnostic evaluation: run any agent over a fixed dataset, score it, compare variants, and report with honest statistics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Rishikesh Yadav"},
]
dependencies = []
keywords = ["agent", "evaluation", "evals", "llm", "testing", "scorecard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.scripts]
agent-evals = "agent_evals.cli.main:main"

[project.optional-dependencies]
mlflow = ["mlflow>=2.10"]
databricks = ["databricks-sdk>=0.30"]
# The CLI is what you install at the agent's root, and it requires OpenTelemetry. The library it
# wraps stays dependency-free, which is the property `python -m agent_evals.selfcheck` proves.
cli = [
    "typer>=0.12",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]

[project.urls]
Homepage = "https://github.com/rishikeshyadav-lg/agent-evals"
Repository = "https://github.com/rishikeshyadav-lg/agent-evals"
Issues = "https://github.com/rishikeshyadav-lg/agent-evals/issues"
Changelog = "https://github.com/rishikeshyadav-lg/agent-evals/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = { find = { include = ["agent_evals*"] } }
package-data = { agent_evals = ["py.typed"] }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008 flags a call in a default argument, which catches shared mutable defaults. Every one here is a
# frozen dataclass (RunSettings(), ScorecardMetrics()), so sharing one instance is safe and intended.
ignore = ["UP042", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["agent_evals"]

[tool.mypy]
python_version = "3.11"
files = ["agent_evals"]
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
